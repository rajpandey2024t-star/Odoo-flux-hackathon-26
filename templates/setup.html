<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up Subly</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="auth-brand" href="/"> <span class="auth-mark">✓</span> subly<span>.</span></a>
      <p class="auth-eyebrow">FIRST-TIME SETUP</p>
      <h1>Create your admin account</h1>
      <p class="auth-description">This account will manage plans, billing and workspace access.</p>
      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('setup') }}">
        <label>Your name<input name="name" autocomplete="name" required placeholder="e.g. Raj Pandey"></label>
        <label>Work email<input name="email" type="email" autocomplete="email" required placeholder="you@company.com"></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="9" placeholder="Create a strong password"><small>More than 8 characters, with uppercase, lowercase and a special character.</small></label>
        <button type="submit">Create admin account <span>→</span></button>
      </form>
      <p class="auth-footnote">Your password is stored as a secure hash.</p>
    </section>
    <footer>Subscription management, made clear.</footer>
  </main>
</body>
</html>
